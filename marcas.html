<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WCCollection - Marcas Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; outline: none; }
    
    body { background-color: #282A2D; color: #DDDDDD; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; user-select: none; }

    .app-container { display: flex; flex-direction: column; width: 100vw; min-height: 100vh; position: relative; background-color: #282A2D; }

    /* TELA DE CARREGAMENTO */
    .loading-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #282A2D; z-index: 9999; display: flex;
      flex-direction: column; justify-content: center; align-items: center; gap: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-logo { width: 140px; height: auto; object-fit: contain; }
    .loading-text { color: #f39c12; font-size: 0.95rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .spinner { width: 36px; height: 36px; border: 4px solid rgba(243, 156, 18, 0.2); border-top: 4px solid #f39c12; border-radius: 50%; animation: spin 1s linear infinite; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .mobile-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(22, 27, 38, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 1000;
    }
    .mobile-menu-btn { background: transparent; color: #f39c12; border: none; font-size: 1.8rem; cursor: pointer; }
    .header-logo { height: 32px; width: auto; object-fit: contain; }

    .sidebar-drawer {
      position: fixed; top: 0; left: -280px; width: 260px; height: 100vh;
      background: rgba(22, 27, 38, 0.98); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; padding: 24px 16px; gap: 8px;
      z-index: 2000; border-right: 1px solid rgba(255,255,255,0.08);
      transition: left 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); overflow-y: auto;
    }
    .sidebar-drawer.open { left: 0; }
    .drawer-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1500; }
    .drawer-overlay.active { display: block; }

    .cat-btn {
      display: flex; align-items: center; width: 100%; padding: 12px 14px; border-radius: 10px;
      background: transparent; color: #e2e8f0; font-size: 0.95rem; font-weight: 600; border: none;
      text-align: left; cursor: pointer; text-transform: uppercase !important;
    }

    .main-area { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 12px; }

    /* CAMPO DE BUSCA DE MARCAS NO TOPO */
    .brand-search-wrapper { width: 100%; margin-bottom: 8px; }
    .brand-search-input {
      width: 100%; padding: 12px 16px; background: #11141d; border: 2px solid #f39c12;
      border-radius: 8px; color: #f39c12; font-size: 0.95rem; font-weight: 700; text-transform: uppercase;
    }

    .counter-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; }
    .sort-icon-btn { background: transparent; color: #a0aec0; border: none; font-size: 1rem; cursor: pointer; }
    .card-counter { font-size: 0.85rem; font-weight: 900; color: #e2e8f0; }

    /* CATÁLOGO EM GRADE RESPONSIVA */
    .catalog-section { width: 100%; }
    .card-row { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
      gap: 10px; width: 100%; 
    }

    .card {
      width: 100% !important; height: 160px !important; background: #ffffff !important;
      border-radius: 8px !important; overflow: hidden !important; display: flex !important;
      flex-direction: column !important; cursor: pointer !important;
    }

    .card-top-photo { width: 100% !important; height: 115px !important; background: #ffffff !important; display: flex !important; justify-content: center !important; align-items: center !important; padding: 2px !important; }
    .card-top-photo img { max-width: 100% !important; max-height: 100% !important; object-fit: contain !important; }

    .card-bottom-bar { width: 100% !important; height: 45px !important; padding: 2px 4px !important; display: flex !important; flex-direction: column !important; justify-content: space-between !important; }
    .card-bar-title { font-size: 0.65rem !important; font-weight: 700 !important; color: #ffffff !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
    .card-bar-details { display: flex !important; justify-content: space-between !important; align-items: center !important; width: 100% !important; }
    .card-bar-country { display: flex !important; align-items: center !important; gap: 2px !important; font-size: 0.55rem !important; color: #ffffff !important; }

    @media (min-width: 560px) {
      .card-row { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
      .card { height: 170px !important; }
      .card-top-photo { height: 125px !important; }
    }
  </style>
</head>
<body>

  <div class="loading-screen" id="loadingScreen">
    <img src="logo.png" alt="Logo" class="loading-logo">
    <div class="spinner"></div>
    <div class="loading-text">CARREGANDO MARCAS...</div>
  </div>

  <div class="drawer-overlay" id="drawerOverlay" onclick="closeMenu()"></div>

  <div class="app-container">
    <header class="mobile-header">
      <button class="mobile-menu-btn" onclick="toggleMenuMobile(event)">☰</button>
      <img src="logo.png" alt="WCCollection" class="header-logo">
      <div style="width: 24px;"></div>
    </header>

    <nav class="sidebar-drawer" id="sidebarDrawer">
      <button class="cat-btn" onclick="window.location.href='index.html'">HOME / CATÁLOGO</button>
      <button class="cat-btn" onclick="switchTab('ococ')">OCOC (PAÍSES)</button>
      <button class="cat-btn" onclick="switchTab('sets')">SETS & PACKS</button>
    </nav>

    <main class="main-area">
      <div class="brand-search-wrapper">
        <input type="text" id="topBrandInput" class="brand-search-input" placeholder="BUSCAR MARCA..." oninput="filterCatalogByBrand(this.value)">
      </div>

      <div class="counter-bar">
        <button class="sort-icon-btn" onclick="toggleSortOrder()">▼ ORDENAR</button>
        <div class="card-counter" id="cardCounter">0/0</div>
      </div>

      <section class="catalog-section">
        <div class="card-row" id="cardRow"></div>
      </section>
    </main>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwP4kTpSrGJllmlWjQp1YmD1Th5jiw1oUtX5cAJAZj9txy-eNi6_EYyLPG_Q0_coyT9/exec";
  let canCatalog = [];
  let currentFiltered = [];
  let sortNewestFirst = true;

  function fixDriveUrl(url) {
    if (!url) return '';
    const str = String(url).trim();
    const match = str.match(/\/d\/([^\/\?]+)/);
    return match && match[1] ? `https://lh3.googleusercontent.com/d/${match[1]}` : str;
  }

  function getOptimizedImageUrl(url, size = 300) {
    if (!url) return '';
    const cleanUrl = fixDriveUrl(url);
    return cleanUrl.includes('googleusercontent.com') ? cleanUrl.split('=')[0] + `=s${size}-rw` : cleanUrl;
  }

  function formatCapitalizedText(str) {
    if (!str) return '';
    return String(str).toLowerCase().trim().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  }

  function hideLoadingScreen() {
    const screen = document.getElementById("loadingScreen");
    if (screen) screen.classList.add("hidden");
  }

  async function fetchCatalogFromSheet() {
    const cachedData = localStorage.getItem("beercan_catalog_cache");
    if (cachedData) {
      try {
        canCatalog = JSON.parse(cachedData);
        filterCatalogByBrand("");
        hideLoadingScreen();
      } catch (e) {}
    }

    try {
      const response = await fetch(API_URL);
      const freshData = await response.json();
      if (Array.isArray(freshData) && freshData.length > 0) {
        canCatalog = freshData;
        localStorage.setItem("beercan_catalog_cache", JSON.stringify(freshData));
        filterCatalogByBrand("");
        hideLoadingScreen();
      }
    } catch (err) {
      hideLoadingScreen();
    }
  }

  function toggleMenuMobile(e) {
    if(e) e.stopPropagation();
    document.getElementById("sidebarDrawer").classList.toggle("open");
    document.getElementById("drawerOverlay").classList.toggle("active");
  }

  function closeMenu() {
    document.getElementById("sidebarDrawer").classList.remove("open");
    document.getElementById("drawerOverlay").classList.remove("active");
  }

  function toggleSortOrder() {
    sortNewestFirst = !sortNewestFirst;
    const query = document.getElementById("topBrandInput").value;
    filterCatalogByBrand(query);
  }

  function filterCatalogByBrand(query) {
    const val = query ? query.toLowerCase().trim() : "";
    let list = canCatalog.filter(can => !can.isSet || String(can.isSet).toLowerCase() === "false");
    if (sortNewestFirst) list = [...list].reverse();

    currentFiltered = list.filter(can => !val || String(can.brewery || can.Cervejaria || "").toLowerCase().includes(val));
    renderApp();
    document.getElementById("cardCounter").innerText = `1/${currentFiltered.length}`;
  }

  function renderApp() {
    const row = document.getElementById("cardRow");
    if (!row) return;
    row.innerHTML = "";

    currentFiltered.forEach((can) => {
      const frontImg = getOptimizedImageUrl(can.ImgCover || can.cover || can.ImgFront, 300);
      const brandFormatted = formatCapitalizedText(can.brewery || can.Cervejaria || "Cerveja");
      const countryFormatted = formatCapitalizedText(can.country || can.Pais || "");

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="card-top-photo"><img src="${frontImg}" loading="lazy"></div>
        <div class="card-bottom-bar" style="background-color: ${can.brandColor || '#008234'};">
          <div class="card-bar-title">${brandFormatted}</div>
          <div class="card-bar-details">
            <div class="card-bar-country"><span>${countryFormatted}</span></div>
            ${can.volume ? `<div class="card-bar-vol">${can.volume}</div>` : ''}
          </div>
        </div>
      `;
      row.appendChild(card);
    });
  }

  window.onload = fetchCatalogFromSheet;
</script>
</body>
</html>
