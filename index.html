<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>WCCollection - Mobile SPA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; outline: none; }
    
    /* BASE PARA BLOQUEIO DE ROTAÇÃO */
    html, body { 
      background-color: #282A2D; 
      color: #DDDDDD; 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      user-select: none;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* CLASSE APLICADA VIA JS SE O DISPOSITIVO FOR GIRADO */
    body.force-portrait {
      transform: rotate(-90deg);
      transform-origin: left top;
      width: 100vh !important;
      height: 100vw !important;
      position: absolute !important;
      top: 100% !important;
      left: 0 !important;
    }

    .app-container { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; background-color: #282A2D; overflow: hidden; }

    /* TELA DE CARREGAMENTO */
    .loading-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #282A2D; z-index: 9999; display: flex;
      flex-direction: column; justify-content: center; align-items: center; gap: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-logo { width: 140px; height: auto; object-fit: contain; animation: pulse 1.5s infinite ease-in-out; }
    .loading-text { color: #f39c12; font-size: 0.95rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .spinner { width: 36px; height: 36px; border: 4px solid rgba(243, 156, 18, 0.2); border-top: 4px solid #f39c12; border-radius: 50%; animation: spin 1s linear infinite; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }

    /* HEADER FIXO NO TOPO */
    .mobile-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: rgba(22, 27, 38, 0.98);
      border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; z-index: 1000;
    }
    .mobile-menu-btn { background: transparent; color: #f39c12; border: none; font-size: 1.8rem; cursor: pointer; }
    .header-logo { height: 30px; width: auto; object-fit: contain; }

    /* MENU GAVETA DESLIZANTE */
    .sidebar-drawer {
      position: fixed; top: 0; left: -280px; width: 260px; height: 100vh;
      background: rgba(22, 27, 38, 0.98); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; padding: 20px 14px; gap: 4px;
      z-index: 2000; border-right: 1px solid rgba(255,255,255,0.08);
      transition: left 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); overflow-y: auto;
      box-shadow: 10px 0 30px rgba(0,0,0,0.6);
    }
    .sidebar-drawer.open { left: 0; }
    .drawer-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index: 1500; }
    .drawer-overlay.active { display: block; }

    .cat-btn {
      display: flex; align-items: center; width: 100%; padding: 8px 12px; border-radius: 8px;
      background: transparent; color: #e2e8f0; font-size: 0.85rem; font-weight: 600; border: none;
      text-align: left; cursor: pointer; text-transform: uppercase !important; line-height: 1.2;
    }
    .cat-btn:active, .cat-btn:hover { background: rgba(255,255,255,0.1); color: #f39c12; }

    .inline-panel-container { display: none; flex-direction: column; gap: 2px; padding: 2px 0; max-height: 220px; overflow-y: auto; }
    .inline-panel-container.active { display: flex; }

    .brand-btn { 
      font-size: 0.8rem; padding: 6px 10px; border-radius: 6px; background: transparent; color: #a0aec0; 
      border: none; text-align: left; font-weight: 600; text-transform: uppercase; white-space: nowrap; 
      overflow: hidden; text-overflow: ellipsis; line-height: 1.2; display: block; min-height: 32px;
    }
    .brand-btn:active, .brand-btn:hover { color: #ffffff; background: rgba(255,255,255,0.1); }

    .menu-search-box { width: 100%; padding: 8px; background: #11141d; border: 1px solid #333d52; border-radius: 6px; color: #fff; font-size: 0.8rem; text-transform: uppercase; margin-top: 2px; }
    
    .sort-dropdown {
      background: rgba(31, 35, 45, 0.9);
      color: #f39c12;
      border: 1px solid rgba(243, 156, 18, 0.3);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    /* ESTRUTURA PRINCIPAL COM HERO FIXO */
    .main-area { flex: 1; display: flex; flex-direction: column; height: calc(100vh - 51px); overflow: hidden; }

/* BLOCO HERO AJUSTADO PARA MAIOR CAPACIDADE DE TEXTO */
    .hero-panel { 
      background: rgba(22, 27, 38, 0.95); 
      border-bottom: 1px solid rgba(255,255,255,0.1); 
      display: flex; 
      flex-direction: column; 
      padding: 10px 12px; 
      gap: 8px; 
      flex-shrink: 0; 
      z-index: 100;
      position: relative; 
      overflow: hidden;
      max-height: 48vh; /* Permite expansão do hero ocupando até 48% da altura da tela */
    }

    .hero-brand-wallpaper {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      opacity: 0; transition: opacity 0.5s ease; z-index: 1; pointer-events: none;
    }
    .hero-brand-wallpaper.active { opacity: 0.25; }

    .hero-content { display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 10; height: 100%; }
    
    .hero-left-photos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; flex-shrink: 0; }
    .hero-photo-card { 
      background: #ffffff; border-radius: 6px; padding: 2px; display: flex; 
      justify-content: center; align-items: center; aspect-ratio: 1/1; overflow: hidden; cursor: pointer;
    }
    .hero-photo-card img { width: 100%; height: 100%; object-fit: contain; }

    .hero-right-info { display: flex; flex-direction: column; gap: 2px; color: #e2e8f0; overflow: hidden; }
    .hero-title { font-size: 1.1rem; font-weight: 900; font-style: italic; color: #f39c12; text-transform: uppercase; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-info-row { display: flex; align-items: baseline; gap: 6px; }
    .info-label { font-size: 0.75rem; font-weight: 700; color: #8c8c8c; }
    .info-value { font-size: 0.85rem; font-weight: bold; font-style: italic; color: #e2e8f0; text-transform: uppercase; }
    
    /* SUPORTE PARA ATÉ 7 LINHAS NA DESCRIÇÃO */
    .hero-brand-desc { 
      margin-top: 4px; 
      font-size: 0.75rem; 
      line-height: 1.25; 
      color: #cbd5e1; 
      display: -webkit-box; 
      -webkit-line-clamp: 7; /* Aumentado de 2 para 7 linhas */
      -webkit-box-orient: vertical; 
      overflow-y: auto; /* Permite rolagem se a descrição for ainda maior que 7 linhas */
      padding-right: 4px;
    }
    .counter-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: #1f232d; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
    .card-counter { font-size: 0.85rem; font-weight: 900; color: #e2e8f0; }

    /* ÁREA COM ROLAGEM INDEPENDENTE PARA OS CARDS */
    .catalog-section { flex: 1; overflow-y: auto; padding: 10px 12px; -webkit-overflow-scrolling: touch; }
    
    .card-row { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; width: 100%; 
    }

.card {
      width: 100% !important; height: 160px !important; background: #ffffff !important;
      border-radius: 8px !important; overflow: hidden !important; display: flex !important;
      flex-direction: column !important; border: 2px solid transparent !important; cursor: pointer !important;
    }
    .card.focused { border-color: #f39c12 !important; box-shadow: 0 0 10px rgba(243, 156, 18, 0.5) !important; }

    .card-top-photo { width: 100% !important; height: 123px !important; background: #ffffff !important; display: flex !important; justify-content: center !important; align-items: center !important; padding: 2px !important; }
    .card-top-photo img { max-width: 100% !important; max-height: 100% !important; object-fit: contain !important; }

    /* PARTE INFERIOR REDUZIDA EM ~15% */
    .card-bottom-bar { width: 100% !important; height: 37px !important; padding: 2px 4px !important; display: flex !important; flex-direction: column !important; justify-content: space-between !important; }
    .card-bar-title { font-size: 0.60rem !important; font-weight: 700 !important; color: #ffffff !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
    .card-bar-details { display: flex !important; justify-content: space-between !important; align-items: center !important; width: 100% !important; }
    .card-bar-country { display: flex !important; align-items: center !important; gap: 3px !important; font-size: 0.50rem !important; color: #ffffff !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-bar-flag { width: 11px !important; height: 7px !important; object-fit: cover !important; border-radius: 1px !important; flex-shrink: 0 !important; }
    .card-bar-vol { background: rgba(0, 0, 0, 0.45) !important; color: #ffffff !important; padding: 1px 3px !important; border-radius: 3px !important; font-size: 0.48rem !important; flex-shrink: 0; }

    /* CONFIGURAÇÃO SETS AJUSTADA PROPORCIONALMENTE */
    .card-row.sets-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .card-row.sets-grid .card { height: 138px !important; }
    .card-row.sets-grid .card-top-photo { height: 106px !important; }
    .card-row.sets-grid .card-bottom-bar { height: 32px !important; padding: 1px 4px !important; }
    .card-row.sets-grid .card-bar-title { font-size: 0.55rem !important; line-height: 1.1 !important; }
    .card-row.sets-grid .card-bar-country { font-size: 0.48rem !important; }
    
    /* MODAL ZOOM TOTALMENTE TOUCH */
    .zoom-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 3000; display: none; justify-content: center; align-items: center; padding: 10px; overflow: hidden; touch-action: none; }
    .zoom-modal.active { display: flex; }
    .zoom-modal img { 
      max-width: 90vw; max-height: 85vh; object-fit: contain; 
      transition: transform 0.1s ease-out; transform-origin: center center;
    }
    
    .zoom-close-btn {
      position: absolute; top: 16px; right: 20px; color: #f39c12; font-size: 1.8rem; font-weight: bold; z-index: 3100; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="loading-screen" id="loadingScreen">
    <img src="logo.png" alt="Logo" class="loading-logo">
    <div class="spinner"></div>
    <div class="loading-text">CARREGANDO CATÁLOGO...</div>
  </div>

  <div class="drawer-overlay" id="drawerOverlay" onclick="closeMenu()"></div>

  <div class="app-container">
    <header class="mobile-header">
      <button class="mobile-menu-btn" onclick="toggleMenuMobile(event)">☰</button>
      <img src="logo.png" alt="WCCollection" class="header-logo">
      <div style="width: 24px;"></div>
    </header>

    <!-- MENU GAVETA -->
    <nav class="sidebar-drawer" id="sidebarDrawer">
      <button class="cat-btn" onclick="switchTab('home')">HOME / CATÁLOGO</button>
      
      <button class="cat-btn" onclick="toggleSearchInline()">PESQUISAR</button>
      <div class="inline-panel-container" id="searchInlineContainer">
        <input type="text" id="mobileSearchInput" class="menu-search-box" placeholder="DIGITE A BUSCA..." oninput="filterCatalog(this.value)">
      </div>

      <button class="cat-btn" onclick="toggleBrandInline()">MARCAS</button>
      <div class="inline-panel-container" id="brandInlineList"></div>

      <button class="cat-btn" onclick="switchTab('ococ')">OCOC (PAÍSES)</button>
      <button class="cat-btn" onclick="switchTab('sets')">SETS & PACKS</button>
    </nav>

    <main class="main-area">
      <!-- BLOCO HERO FIXO NA TELA COM WALLPAPER -->
      <section class="hero-panel">
        <div class="hero-brand-wallpaper" id="heroBrandWallpaper"></div>
        <div class="hero-content">
          <div class="hero-left-photos">
            <div class="hero-photo-card" onclick="openZoomModal(0)"><img src="" id="heroPhoto1"></div>
            <div class="hero-photo-card" onclick="openZoomModal(1)"><img src="" id="heroPhoto2"></div>
            <div class="hero-photo-card" onclick="openZoomModal(2)"><img src="" id="heroPhoto3"></div>
            <div class="hero-photo-card" onclick="openZoomModal(3)"><img src="" id="heroPhoto4"></div>
          </div>
          <div class="hero-right-info">
            <h1 class="hero-title" id="heroTitle">Selecione uma lata</h1>
            <div class="hero-info-row"><span class="info-label">Origem:</span><span class="info-value" id="heroCountry">-</span></div>
            <div class="hero-info-row"><span class="info-label">Volume:</span><span class="info-value" id="heroVolume">-</span></div>
            <div class="hero-info-row"><span class="info-label">Ano:</span><span class="info-value" id="heroYear">-</span></div>
            <div class="hero-info-row"><span class="info-label">Cód. Barras:</span><span class="info-value" id="heroBarcode">-</span></div>
            <div class="hero-brand-desc" id="heroBrandDescription"></div>
          </div>
        </div>
      </section>

      <div class="counter-bar">
        <select id="sortSelect" class="sort-dropdown" onchange="handleSortChange(this.value)">
          <option value="newest">Mais recentes</option>
          <option value="oldest">Mais antingos</option>
          <option value="az">Alfabetica A-Z</option>
          <option value="za">Alfabetica Z-A</option>
        </select>
        <div class="card-counter" id="cardCounter">0/0</div>
      </div>

      <!-- ÁREA ROLÁVEL COM OS CARDS -->
      <section class="catalog-section">
        <div class="card-row" id="cardRow"></div>
      </section>
    </main>
  </div>

  <!-- MODAL ZOOM TOTALMENTE TOUCH -->
  <div class="zoom-modal" id="zoomModal">
    <span class="zoom-close-btn" onclick="closeZoomModal()">&times;</span>
    <img id="zoomImage" src="">
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwP4kTpSrGJllmlWjQp1YmD1Th5jiw1oUtX5cAJAZj9txy-eNi6_EYyLPG_Q0_coyT9/exec";
  let canCatalog = [];
  let currentFiltered = [];
  let zoomGallery = [];
  let currentZoomIndex = 0;
  let currentSortMode = 'newest';
  let currentTab = 'home';
  let activeIndex = 0;

  /* TRAVA DE ROTAÇÃO VERTICAL (PORTRAIT) */
  function enforcePortraitOrientation() {
    if (window.innerWidth > window.innerHeight) {
      document.body.classList.add("force-portrait");
    } else {
      document.body.classList.remove("force-portrait");
    }
  }

  window.addEventListener("resize", enforcePortraitOrientation);
  window.addEventListener("orientationchange", enforcePortraitOrientation);

  /* UTILITÁRIOS DE MÍDIA E TEXTO */
  function fixDriveUrl(url) {
    if (!url) return '';
    const str = String(url).trim();
    const match = str.match(/\/d\/([^\/\?]+)/);
    return match && match[1] ? `https://lh3.googleusercontent.com/d/${match[1]}` : str;
  }

  function getOptimizedImageUrl(url, size = 300) {
    if (!url) return '';
    const cleanUrl = fixDriveUrl(url);
    return cleanUrl.includes('googleusercontent.com') ? cleanUrl.split('=')[0] + `=s${size}-rw` : cleanUrl;
  }

  function formatCapitalizedText(str) {
    if (!str) return '';
    return String(str).toLowerCase().trim().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  }

  function getFlagUrlByCountry(countryName) {
    if (!countryName) return '';
    const name = String(countryName)
      .toLowerCase()
      .trim()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
    
    const countryCodes = {
      'brasil': 'br', 'brazil': 'br', 'argentina': 'ar', 'bolivia': 'bo', 'chile': 'cl', 
      'colombia': 'co', 'equador': 'ec', 'ecuador': 'ec', 'guiana': 'gy', 'gyana': 'gy',
      'guiana francesa': 'gf', 'paraguai': 'py', 'paraguay': 'py', 'peru': 'pe', 
      'suriname': 'sr', 'uruguai': 'uy', 'uruguay': 'uy', 'venezuela': 've',
      'antigua e barbuda': 'ag', 'bahamas': 'bs', 'barbados': 'bb', 'belize': 'bz', 
      'canada': 'ca', 'costa rica': 'cr', 'cuba': 'cu', 'dominica': 'dm', 'el salvador': 'sv', 
      'estados unidos': 'us', 'eua': 'us', 'usa': 'us', 'granada': 'gd', 'guatemala': 'gt', 
      'haiti': 'ht', 'honduras': 'hn', 'jamaica': 'jm', 'mexico': 'mx', 'nicaragua': 'ni', 
      'panama': 'pa', 'porto rico': 'pr', 'republica dominicana': 'do', 
      'sao cristovao e nevis': 'kn', 'sao vicente e granadinas': 'vc', 'santa lucia': 'lc', 
      'trinidad e tobago': 'tt', 'albania': 'al', 'alemanha': 'de', 'germany': 'de', 'andorra': 'ad', 'armenia': 'am', 
      'austria': 'at', 'azerbaijao': 'az', 'belgica': 'be', 'bielorrussia': 'by', 
      'bosnia e herzegovina': 'ba', 'bulgaria': 'bg', 'chipre': 'cy', 'croacia': 'hr', 
      'dinamarca': 'dk', 'eslovaquia': 'sk', 'eslovenia': 'si', 'espanha': 'es', 
      'estonia': 'ee', 'finlandia': 'fi', 'franca': 'fr', 'france': 'fr', 'georgia': 'ge', 
      'grecia': 'gr', 'holanda': 'nl', 'paises baixos': 'nl', 'netherlands': 'nl', 
      'hungria': 'hu', 'irlanda': 'ie', 'islandia': 'is', 'italia': 'it', 'kosovo': 'xk', 
      'letonia': 'lv', 'liechtenstein': 'li', 'lituania': 'lt', 'luxemburgo': 'lu', 
      'macedonia do norte': 'mk', 'malta': 'mt', 'moldavia': 'md', 'monaco': 'mc', 
      'montenegro': 'me', 'noruega': 'no', 'polonia': 'pl', 'portugal': 'pt', 
      'reino unido': 'gb', 'uk': 'gb', 'inglaterra': 'gb', 'escocia': 'gb', 'paises de gales': 'gb', 
      'republica tcheca': 'cz', 'tchequia': 'cz', 'romenia': 'ro', 'russia': 'ru', 
      'san marino': 'sm', 'servia': 'rs', 'suecia': 'se', 'suica': 'ch', 'turquia': 'tr', 
      'ucrania': 'ua', 'vaticano': 'va', 'afeganistao': 'af', 'arabia saudita': 'sa', 'bangladesh': 'bd', 'bahrein': 'bh', 
      'brunei': 'bn', 'butao': 'bt', 'camboja': 'kh', 'catar': 'qa', 'qatar': 'qa', 
      'cazaquistao': 'kz', 'china': 'cn', 'coreia do norte': 'kp', 'coreia do sul': 'kr', 
      'emirados arabes unidos': 'ae', 'eau': 'ae', 'filipinas': 'ph', 'iemen': 'ye', 
      'india': 'in', 'indonesia': 'id', 'iraque': 'iq', 'ira': 'ir', 'israel': 'il', 
      'japao': 'jp', 'japan': 'jp', 'jordania': 'jo', 'kuwait': 'kw', 'laos': 'la', 
      'libano': 'lb', 'malasia': 'my', 'maldivas': 'mv', 'mianmar': 'mm', 'mongolia': 'mn', 
      'nepal': 'np', 'oman': 'om', 'paquistao': 'pk', 'quirguistao': 'kg', 'singapura': 'sg',

      'timor leste': 'tl', 'turcomenistao': 'tm', 'uzbequistao': 'uz', 'vietna': 'vn',
      'africa do sul': 'za', 'angola': 'ao', 'algeria': 'dz', 'benin': 'bj', 'botsuana': 'bw',

      'guine equatorial': 'gq', 'ilha mauricio': 'mu', 'lesoto': 'ls', 'liberia': 'lr', 
      'libia': 'ly', 'madagascar': 'mg', 'malawi': 'mw', 'mali': 'ml', 'marrocos': 'ma', 
      'mauritania': 'mr', 'mocambique': 'mz', 'namibia': 'na', 'niger': 'ne', 'nigeria': 'ng', 
      'quenia': 'ke', 'republica centro africana': 'cf', 'republica democratica do congo': 'cd', 
      'ruanda': 'rw', 'sao tome e principe': 'st', 'senegal': 'sn', 'serra leoa': 'sl', 
      'seichelas': 'sc', 'somalia': 'so', 'sudao': 'sd', 'sudao do sul': 'ss', 
      'tanzania': 'tz', 'togo': 'tg', 'tunisia': 'tn', 'uganda': 'ug', 'zambia': 'zm', 
      'zimbabue': 'zw', 'australia': 'au', 'fiji': 'fj', 'ilhas marechal': 'mh', 'ilhas salomao': 'sb', 
      'kiribati': 'ki', 'micronesia': 'fm', 'nauru': 'nr', 'nova zelandia': 'nz', 
      'palau': 'pw', 'papua nova guine': 'pg', 'samoa': 'ws', 'tonga': 'to', 
      'tuvalu': 'tv', 'vanuatu': 'vu'
    };

    const code = countryCodes[name];
    if (code) return `https://flagcdn.com/w40/${code}.png`;
    return '';
  }

  function hideLoadingScreen() {
    const screen = document.getElementById("loadingScreen");
    if (screen) screen.classList.add("hidden");
  }

  /* REQUISIÇÃO E CACHE DE DADOS */
  async function fetchCatalogFromSheet() {
    const cachedData = localStorage.getItem("beercan_catalog_cache");
    if (cachedData) {
      try {
        canCatalog = JSON.parse(cachedData);
        buildBrandList();
        processTabChange();
        hideLoadingScreen();
      } catch (e) {
        console.error("Erro cache:", e);
      }
    }

    try {
      const response = await fetch(API_URL);
      const freshData = await response.json();
      if (Array.isArray(freshData) && freshData.length > 0) {
        canCatalog = freshData;
        localStorage.setItem("beercan_catalog_cache", JSON.stringify(freshData));
        buildBrandList();
        processTabChange();
        hideLoadingScreen();
      }
    } catch (err) {
      console.error("Erro API:", err);
      hideLoadingScreen();
    }
  }

  /* MONTAGEM DO MENU DE MARCAS */
  function buildBrandList() {
    const brandContainer = document.getElementById("brandInlineList");
    if (!brandContainer) return;
    brandContainer.innerHTML = "";
    
    const brands = [...new Set(canCatalog.map(c => c.brewery || c.Cervejaria).filter(Boolean))].sort();

    const allBtn = document.createElement("button");
    allBtn.className = "brand-btn";
    allBtn.innerText = "TODAS AS MARCAS";
    allBtn.onclick = () => { filterCatalog(""); closeMenu(); };
    brandContainer.appendChild(allBtn);

    brands.forEach(b => {
      const btn = document.createElement("button");
      btn.className = "brand-btn";
      btn.innerText = String(b).toUpperCase();
      btn.onclick = () => { filterCatalog(b); closeMenu(); };
      brandContainer.appendChild(btn);
    });
  }

  function switchTab(tabName) {
    currentTab = tabName;
    closeMenu();
    processTabChange();
  }

  /* LÓGICA DE ORDENAÇÃO */
  function handleSortChange(value) {
    currentSortMode = value;
    const searchVal = document.getElementById("mobileSearchInput") ? document.getElementById("mobileSearchInput").value : "";
    filterCatalog(searchVal);
  }

  function processTabChange() {
    const searchVal = document.getElementById("mobileSearchInput") ? document.getElementById("mobileSearchInput").value : "";
    filterCatalog(searchVal);
  }

  function getBaseListForCurrentTab() {
    let list = [];
    if (currentTab === 'home') {
      list = canCatalog.filter(can => !can.isSet || String(can.isSet).toLowerCase() === "false");
    } else if (currentTab === 'ococ') {
      const ococMap = new Map();
      canCatalog.forEach(can => {
        const brand = String(can.brewery || can.Cervejaria || "").toLowerCase().trim();
        const country = String(can.country || can.Pais || "").toLowerCase().trim();
        if ((!can.isSet || String(can.isSet).toLowerCase() === "false") && (can.isOcoc === true || String(can.isOcoc).toLowerCase() === "true") && brand && country && !ococMap.has(`${brand}_${country}`)) {
          ococMap.set(`${brand}_${country}`, can);
        }
      });
      list = Array.from(ococMap.values());
    } else if (currentTab === 'sets') {
      list = canCatalog.filter(can => can.isSet === true || String(can.isSet).toLowerCase() === "true");
    }

    return applySorting(list);
  }

  function applySorting(list) {
    const copy = [...list];
    if (currentSortMode === 'newest') {
      return copy.reverse();
    } else if (currentSortMode === 'oldest') {
      return copy;
    } else if (currentSortMode === 'az') {
      return copy.sort((a, b) => {
        const nameA = String(a.brewery || a.Cervejaria || a.name || a.Nome || "").toLowerCase();
        const nameB = String(b.brewery || b.Cervejaria || b.name || b.Nome || "").toLowerCase();
        return nameA.localeCompare(nameB, 'pt-BR');
      });
    } else if (currentSortMode === 'za') {
      return copy.sort((a, b) => {
        const nameA = String(a.brewery || a.Cervejaria || a.name || a.Nome || "").toLowerCase();
        const nameB = String(b.brewery || b.Cervejaria || b.name || b.Nome || "").toLowerCase();
        return nameB.localeCompare(nameA, 'pt-BR');
      });
    }
    return copy;
  }
  function filterCatalog(query) {
    const val = query ? query.toLowerCase().trim() : "";
    const baseList = getBaseListForCurrentTab();
    
    currentFiltered = baseList.filter(can => {
      if (!val) return true;
      
      const name = String(can.name || can.Nome || "").toLowerCase();
      const brewery = String(can.brewery || can.Cervejaria || "").toLowerCase();
      const country = String(can.country || can.Pais || "").toLowerCase();
      const barcode = String(can.barcode || can.Barcode || "").toLowerCase();

      return name.includes(val) || 
             brewery.includes(val) || 
             country.includes(val) || 
             barcode.includes(val);
    });

    activeIndex = 0;
    renderApp();
    if (currentFiltered.length > 0) selectCard(0);
  }


  /* EVENTOS DO MENU DESLIZANTE */
  function toggleMenuMobile(e) {
    if(e) e.stopPropagation();
    document.getElementById("sidebarDrawer").classList.toggle("open");
    document.getElementById("drawerOverlay").classList.toggle("active");
  }

  function closeMenu() {
    document.getElementById("sidebarDrawer").classList.remove("open");
    document.getElementById("drawerOverlay").classList.remove("active");
  }

  function toggleSearchInline() {
    document.getElementById("brandInlineList").classList.remove("active");
    document.getElementById("searchInlineContainer").classList.toggle("active");
  }

  function toggleBrandInline() {
    document.getElementById("searchInlineContainer").classList.remove("active");
    document.getElementById("brandInlineList").classList.toggle("active");
  }

  function selectCard(index) {
    activeIndex = index;
    document.querySelectorAll(".card").forEach((c, i) => c.classList.toggle("focused", i === index));
    const can = currentFiltered[index];
    if (can) {
      updateHeroPanel(can);
      const counterElem = document.getElementById("cardCounter");
      if (counterElem) counterElem.innerText = `${index + 1}/${currentFiltered.length}`;
    }
  }

  /* ATUALIZAÇÃO DO CARROSSEL SUPERIOR (HERO PANEL) */
  function updateHeroPanel(can) {
    document.getElementById("heroTitle").innerText = formatCapitalizedText(can.name || can.Nome || "Selecione uma lata");
    document.getElementById("heroCountry").innerText = formatCapitalizedText(can.country || can.Pais || "-");
    document.getElementById("heroVolume").innerText = can.volume || can.Volume || "-";
    document.getElementById("heroYear").innerText = can.year || can.Ano || "-";
    document.getElementById("heroBarcode").innerText = can.barcode || can.Barcode || "-";

    let brandDescVal = can.brandDesc || can.descricao || can.DESCRICAO || "";
    if (!brandDescVal && (can.brewery || can.Cervejaria)) {
      const brandKey = String(can.brewery || can.Cervejaria).toLowerCase().trim();
      const parentCan = canCatalog.find(c => {
        const b = String(c.brewery || c.Cervejaria || "").toLowerCase().trim();
        const desc = c.brandDesc || c.descricao || c.DESCRICAO;
        return b === brandKey && desc && String(desc).trim() !== "";
      });
      if (parentCan) {
        brandDescVal = parentCan.brandDesc || parentCan.descricao || parentCan.DESCRICAO;
      }
    }
    document.getElementById("heroBrandDescription").innerText = brandDescVal || "";

    const photo1 = getOptimizedImageUrl(can.ImgFront || can.front || can.ImgCover || "", 300);
    const photo2 = getOptimizedImageUrl(can.ImgLeft || can.left || "", 300);
    const photo3 = getOptimizedImageUrl(can.ImgBack || can.back || "", 300);
    const photo4 = getOptimizedImageUrl(can.ImgRight || can.right || "", 300);

    document.getElementById("heroPhoto1").src = photo1;
    document.getElementById("heroPhoto2").src = photo2;
    document.getElementById("heroPhoto3").src = photo3;
    document.getElementById("heroPhoto4").src = photo4;

    updateBrandWallpaper(can.brewery || can.Cervejaria);

    zoomGallery = [
      can.ImgFront || can.front || can.ImgCover,
      can.ImgLeft || can.left,
      can.ImgBack || can.back,
      can.ImgRight || can.right
    ].filter(Boolean);
  }

  function updateBrandWallpaper(brandQuery) {
    const wallpaperElem = document.getElementById("heroBrandWallpaper");
    if (!wallpaperElem) return;

    if (!brandQuery || String(brandQuery).trim() === "") {
      wallpaperElem.style.backgroundImage = "none";
      wallpaperElem.classList.remove("active");
      return;
    }

    const queryLower = String(brandQuery).toLowerCase().trim();
    const sameBrandCans = canCatalog.filter(c => {
      const b = String(c.brewery || c.Cervejaria || "").toLowerCase().trim();
      return b === queryLower || b.includes(queryLower);
    });

    const canWithWallpaper = sameBrandCans.find(c => {
      const wp = c.brandWallpaper || c.wallpaper || c.BRANDWALLPAPER || c.WALLPAPER;
      return wp && String(wp).trim() !== "";
    });

    let wallpaperUrl = "";
    if (canWithWallpaper) {
      wallpaperUrl = canWithWallpaper.brandWallpaper || canWithWallpaper.wallpaper || canWithWallpaper.BRANDWALLPAPER || canWithWallpaper.WALLPAPER;
    } else if (sameBrandCans.length > 0) {
      wallpaperUrl = sameBrandCans[0].brandLogo || sameBrandCans[0].BRAND_LOGO || sameBrandCans[0].ImgCover || sameBrandCans[0].cover;
    }

    if (wallpaperUrl && String(wallpaperUrl).trim() !== "") {
      const fullImgUrl = getOptimizedImageUrl(wallpaperUrl, 800);
      wallpaperElem.style.backgroundImage = `url('${fullImgUrl}')`;
      wallpaperElem.classList.add("active");
    } else {
      wallpaperElem.style.backgroundImage = "none";
      wallpaperElem.classList.remove("active");
    }
  }

  /* RENDERIZAÇÃO DA GRADE DE CARDS */
  function renderApp() {
    const row = document.getElementById("cardRow");
    if (!row) return;
    row.innerHTML = "";

    if (currentTab === 'sets') {
      row.classList.add("sets-grid");
    } else {
      row.classList.remove("sets-grid");
    }

    currentFiltered.forEach((can, index) => {
      const frontImg = getOptimizedImageUrl(can.ImgCover || can.cover || can.ImgFront, 300);
      const brandFormatted = formatCapitalizedText(can.brewery || can.Cervejaria || "Cerveja");
      const countryRaw = can.country || can.Pais || "";
      const countryFormatted = formatCapitalizedText(countryRaw);
      const flagUrl = getFlagUrlByCountry(countryRaw);

      let cardColor = can.brandColor || can.brandcolor || can.BRANDCOLOR || can.corMarca || "";

      if (!cardColor && (can.brewery || can.Cervejaria)) {
        const brandKey = String(can.brewery || can.Cervejaria).toLowerCase().trim();
        const parentCan = canCatalog.find(c => {
          const b = String(c.brewery || c.Cervejaria || "").toLowerCase().trim();
          const color = c.brandColor || c.brandcolor || c.BRANDCOLOR || c.corMarca;
          return b === brandKey && color && String(color).trim() !== "";
        });
        if (parentCan) {
          cardColor = parentCan.brandColor || parentCan.brandcolor || parentCan.BRANDCOLOR || parentCan.corMarca;
        }
      }

      const finalBgColor = cardColor && String(cardColor).trim() !== "" ? cardColor : "#008234";

      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => selectCard(index);

      card.innerHTML = `
        <div class="card-top-photo"><img src="${frontImg}" loading="lazy"></div>
        <div class="card-bottom-bar" style="background-color: ${finalBgColor} !important;">
          <div class="card-bar-title">${brandFormatted}</div>
          <div class="card-bar-details">
            <div class="card-bar-country">
              ${flagUrl ? `<img src="${flagUrl}" class="card-bar-flag" alt="${countryFormatted}">` : ''}
              <span>${countryFormatted}</span>
            </div>
            ${can.volume ? `<div class="card-bar-vol">${can.volume}</div>` : ''}
          </div>
        </div>
      `;
      row.appendChild(card);
    });
  }

  /* CONTROLE TOUCH E PINCH-TO-ZOOM NO LIGHTBOX */
  let zoomScale = 1;
  let startDistance = 0;
  let initialScale = 1;
  let touchStartX = 0;
  let touchEndX = 0;
  let isZooming = false;
  let lastTapTime = 0;

  function openZoomModal(index) {
    if (!zoomGallery || zoomGallery.length === 0) return;
    currentZoomIndex = index;
    resetZoom();
    updateZoomImage();
    document.getElementById("zoomModal").classList.add("active");
  }

  function updateZoomImage() {
    const imgElem = document.getElementById("zoomImage");
    if (imgElem && zoomGallery[currentZoomIndex]) {
      imgElem.src = getOptimizedImageUrl(zoomGallery[currentZoomIndex], 1200);
    }
  }

  function resetZoom() {
    zoomScale = 1;
    const imgElem = document.getElementById("zoomImage");
    if (imgElem) imgElem.style.transform = `scale(1)`;
  }

  function navigateZoom(direction) {
    if (!zoomGallery || zoomGallery.length === 0) return;
    currentZoomIndex = (currentZoomIndex + direction + zoomGallery.length) % zoomGallery.length;
    resetZoom();
    updateZoomImage();
  }

  function closeZoomModal() {
    resetZoom();
    document.getElementById("zoomModal").classList.remove("active");
  }

  const zoomModalElem = document.getElementById("zoomModal");
  const zoomImgElem = document.getElementById("zoomImage");

  if (zoomModalElem) {
    zoomModalElem.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        isZooming = true;
        startDistance = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        initialScale = zoomScale;
      } else if (e.touches.length === 1) {
        isZooming = false;
        touchStartX = e.touches[0].screenX;
      }
    }, { passive: true });

    zoomModalElem.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && isZooming) {
        const currentDistance = Math.hypot(
          e.touches[0].pageX - e.touches[1].pageX,
          e.touches[0].pageY - e.touches[1].pageY
        );
        if (startDistance > 0) {
          zoomScale = Math.min(Math.max(1, initialScale * (currentDistance / startDistance)), 3.5);
          if (zoomImgElem) zoomImgElem.style.transform = `scale(${zoomScale})`;
        }
      }
    }, { passive: true });

    zoomModalElem.addEventListener("touchend", (e) => {
      if (e.touches.length === 0) {
        if (!isZooming && zoomScale <= 1.05) {
          touchEndX = e.changedTouches[0].screenX;
          const diffX = touchEndX - touchStartX;
          if (diffX < -40) navigateZoom(1);  
          else if (diffX > 40) navigateZoom(-1); 
        }
        
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTapTime;
        if (tapLength < 300 && tapLength > 0) {
          if (zoomScale > 1) {
            resetZoom();
          } else {
            zoomScale = 2;
            if (zoomImgElem) zoomImgElem.style.transform = `scale(2)`;
          }
        }
        lastTapTime = currentTime;
      }
    }, { passive: true });
  }

  window.onload = () => {
    enforcePortraitOrientation();
    fetchCatalogFromSheet();
    setTimeout(hideLoadingScreen, 8000); // Trava de segurança para desativar a splash screen em no máximo 8 segundos
  };
</script>
